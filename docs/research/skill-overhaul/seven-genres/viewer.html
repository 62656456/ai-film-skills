</style><header><h1>七题材 · 测试时默认 / A / B 导演故事分镜对照</h1><nav id="nav"></nav></header><main><h2 id="title"></h2><p id="intro"></p><div class="tools"><label>查看方式 <select id="mode"><option value="all">三套并排</option><option value="current">测试时默认 5.6.5 大图</option><option value="a">新版 A 5.7.1 大图</option><option value="b">新版 B 5.7.1-jev 大图</option></select></label><span class="hint">点任意图片打开高清原图，可用浏览器缩放。</span></div><div class="grid" id="grid"></div><details><summary>这个故事的完整原文</summary><p id="story"></p><p id="people"></p></details><div class="footer">每套按30秒编排。本页展示首轮测试图，已发现的具体偏差见<a href="report.md">测试对比与逐图问题</a>。首轮21图中15图含待修观察，共29条，整批审美未通过；未生成实际视频。当前A已按用户明确指令采用，B保留可选文字复核，测试时标签保持。<br><a href="index.md">全部资料与原图</a> · <a href="../index.md">研究总入口</a></div></main><script>
const stories=[{"id": "01", "genre": "悬疑", "title": "背过身的镜子", "environment": "雨夜的旧古董店，黄铜柜台、狭窄后廊、半掩布帘、门口一面能照到后廊的圆凸镜。店灯暖黄，窗外冷雨。", "characters": "女店主闻溪，32岁，齐耳黑发、棕色针织衫；男账房罗晋，45岁，灰开衫、圆眼镜；藏在后廊的第三人只露出黑靴，不揭面。", "story": "闻溪正在清点打烊的钱，把现金放进柜台钱匣；柜台下的红色无声报警按钮已有可见位置。罗晋进门，门后传来另一声踩水声。闻溪问：“谁跟你来的？”罗晋答：“就我一个。”闻溪从圆凸镜里看见后廊帘下多出一双黑靴。她不再追问，慢慢合上钱匣。罗晋顺着她的视线看镜子，伸手把镜面转向墙壁。闻溪保持看着他，藏在柜台下的手按下报警按钮。罗晋还以为她没有发现。", "locks": ["悬疑来自同伙故意遮掉证据，不是鬼怪。", "红色报警按钮先存在，末尾由闻溪主动按下；不出现警察抵达。", "第三人只露黑靴，不新增持械动作。", "镜面朝墙后不再显示任何反射。"], "dialogue": ["闻溪：“谁跟你来的？”", "罗晋：“就我一个。”"], "test": "隐蔽信息、人物视线、镜中空间与末尾主动选择。"}, {"id": "02", "genre": "恐怖", "title": "最后一排床单", "environment": "深夜旧疗养院洗衣房，薄荷绿旧瓷砖，两排悬挂的白床单构成通道，远端铁门，冷白顶灯固定亮着，浅浅积水反光。", "characters": "值班洗衣工阿芩，40岁，盘发、暗黄围裙、红橡胶手套、黑胶靴；没有可见活人怪物。", "story": "阿芩推布草车收最后一排床单，听见一条床单背后有人喘气。她掀开它：只有空架子和墙。她把床单搭上车，后退时发现无人通道里正出现一串新的湿脚印，逐步向她靠近。阿芩停住呼吸，抓紧车把。两旁所有床单却同时向通道内鼓起，像胸口吸气。她松手转向出口；距门最近的一条白床单里缓缓顶出一个没有五官的脸形，挡住去路。最后停在阿芩与白布脸之间尚未接触的距离。", "locks": ["全程不关灯，不用黑场替代恐怖变化。", "脚印由远到近逐步出现，不是一开始就铺满地面。", "先确认布后无人，再发生床单呼吸及布脸。", "没有血腥、追杀或接触；没有新增活人。"], "dialogue": [], "test": "先藏后露、无形威胁、声音先行与空间距离。"}, {"id": "03", "genre": "爱情", "title": "下一班也可以", "environment": "清晨小雨中的海边电车站，浅蓝长椅、湿润石地，轨道沿海岸横向延伸，一辆复古奶油色电车接近并驶离。", "characters": "许棠，27岁，米白长裙、青绿针织衫，右手持黄色雨伞；周野，29岁，橙色骑行外套，手捧一盆罗勒。两人是刚分开的恋人。", "story": "许棠站在伞下等车。周野冒雨来，把一盆略蔫的罗勒递给她，说：“忘在我那儿的。”许棠左手接住花盆，右手继续持伞，只说：“谢谢。”电车进站，周野退到伞外，抹掉脸上的雨，准备转身。许棠看见他湿透的袖口，把花盆轻放在身旁长椅上，腾出左手拉住他的袖子，再把黄伞向他移过去。她说：“下一班吧。”电车驶离，两人肩并肩留在伞下；花盆仍在长椅上，周野没有立刻接话，只把身子靠近一些。", "locks": ["两人都为成年人，关系变化由许棠的主动挽留发生。", "接花盆、放长椅、腾手、拉袖的顺序可追踪。", "黄伞一直由许棠右手拿着；不凭空换手或消失。", "结尾两人留下，电车离开；没有亲吻、求婚或新台词。"], "dialogue": ["周野：“忘在我那儿的。”", "许棠：“谢谢。”", "许棠：“下一班吧。”"], "test": "细小表演、手与道具连续性、情绪转折及环境运动。"}, {"id": "04", "genre": "近身打戏", "title": "桥上只过一个人", "environment": "阴天清晨的山涧窄木桥，湿木板、两侧绳栏、桥头岩石，桥宽约容两人错身。桥通向对面山道。", "characters": "信使岑舟，25岁，短发、靛蓝短衫、腰侧红色小皮匣；拦路者段魁，36岁，结实体格、褐色无袖坎肩、黑布裤。双方徒手，无兵器。", "story": "岑舟护着腰侧皮匣过桥，段魁迎面堵住去路，伸手夺匣。岑舟侧身护匣，用前臂挡开对方手臂；段魁趁势用肩把她撞向绳栏，她背部受压、双脚滑动，桥随撞击摇晃。段魁再次扑来夺匣。岑舟左手抓稳绳栏，顺着桥的回摆转身让开，对方的前冲落空；她随即从侧面绊住他已经前移的腿，使他跪跌在木板上。岑舟自己也险些失衡，扶住绳栏站稳，绕过仍在撑地的段魁跑向对岸。红皮匣始终留在她腰侧。", "locks": ["只两名成人徒手，禁止突然出现刀枪或飞檐法术。", "接触、失衡、回摆、支撑和结果必须连得上；对手不是无故自己摔倒。", "段魁跪倒在桥面，不能掉下山涧；岑舟不胜利摆拍。", "皮匣全程不被夺走，结尾岑舟过桥，对手留桥面。"], "dialogue": [], "test": "攻防变化、身体支撑与受力、动作因果和时间密度。"}, {"id": "05", "genre": "枪战", "title": "关门之前", "environment": "雪后的货运列车检修库，混凝土检修坑、停放的银色货车、近侧蓝色厚钢门、对面高出地面的装卸平台，冷日光。", "characters": "护运员陆川，38岁，深绿棉外套，持黑色手枪；女检修员杜莎，33岁，蓝工作服、左腿受伤但可搀扶行走；对面袭击者，成年男子，浅灰防寒服，持长枪。", "story": "陆川躲在近侧混凝土柱后，杜莎伏在几步外的检修台旁，离蓝钢门很近却无法独自站起。对面装卸平台的袭击者开火，弹着点打在两人之间的钢车体。陆川问：“能走吗？”杜莎摇头，伸出手：“扶我一下。”陆川朝对方方向还击，趁对方缩回遮挡，跨到杜莎身边，将她扶起。杜莎右脚用力、左脚拖着，两人一起跨入蓝钢门。陆川先让她进门，自己最后退入并拉上钢门。门合拢后，外侧再响一声撞击；门内两人喘息，杜莎仍由他扶着。", "locks": ["三名成人，非血腥；不增加倒地死亡或爆炸。", "两边火线与掩体位置稳定，不让陆川枪口指向杜莎。", "杜莎左腿受伤持续，靠搀扶进入，不突然奔跑。", "蓝门结尾关闭，射击余声来自门外；不让弹迹穿过完好厚门打中人。"], "dialogue": ["陆川：“能走吗？”", "杜莎：“扶我一下。”"], "test": "双方空间、视线与火线、掩体、救援动作及声画因果。"}, {"id": "06", "genre": "赛车追逐", "title": "松开的油门", "environment": "落日下的封闭海崖测试赛道，干燥沥青、金属护栏、一个向右的长弯，前方可见终点门架；无公共车流与行人。", "characters": "女车手简星，31岁，黑色全盔、白色赛车服，驾驶亮黄色双门跑车；男车手韩越，34岁，白色全盔、黑赛车服，驾驶深蓝色双门跑车。", "story": "黄色与深蓝两辆跑车并排冲向最后的右弯，终点门架已在远处。深蓝车外侧后轮突然破损，车身摆动，横到黄色车的行进路线上。简星看见蓝车司机还在车内。她放弃争抢位置，立即减速并修正方向，黄车轮胎冒出短促烟迹，险险在蓝车前侧停住，两车没有碰撞。蓝车也在护栏内停稳。简星放下车窗，望向对方；韩越抬起还能活动的手，示意自己没事。她长呼一口气。最后两车都停在终点前，落日照着仍空着的门架。", "locks": ["车辆分别始终为黄色与深蓝双门跑车；同一封闭赛道、同一行进方向。", "失控由已出现的蓝车后轮破损触发；黄色车是主动制动避撞。", "没有相撞、翻车、跳崖、爆炸；司机都活着。", "结尾二车停在终点前，不能改成黄车夺冠或继续追逐。"], "dialogue": [], "test": "速度、运动方向、驾驶主观、刹车距离观感和从快到静的节奏。"}, {"id": "07", "genre": "超能力动作", "title": "逆坠", "environment": "雨后的未来城市高架步行桥，桥侧玻璃楼群、霓虹及实体警示灯，断裂的金属遮雨棚仍由一侧连接件悬住，行人通道通向右侧安全平台。", "characters": "快递员洛岚，28岁，短卷发、银灰防雨夹克、紫色内搭、橙色斜挎邮包；维修工贺峥，46岁，深蓝工服、黄色安全帽。原创人物，无现成英雄标志或服装。", "story": "洛岚走上桥时，一颗松动的螺栓落到她面前；她张开左手，螺栓在掌心上方悬住，随后落入手中。前方遮雨棚连接处继续崩裂，巨大的金属棚板向桥上的贺峥压下。洛岚丢开小螺栓，冲到安全平台边，双手向上撑起。棚板在贺峥头顶近处停住，边缘几滴雨水悬浮；洛岚脚下地砖开裂，膝盖发抖，显出承担重量的代价。贺峥弯身从棚板下退出，到达她身后的安全平台。确认他离开后，洛岚双臂缓缓下沉，让棚板落到已经空出的桥面。她终于跪下，贺峥伸手扶住她；城市车流在桥下继续。", "locks": ["能力为隔空托举：先以小螺栓建立，再用于棚板；不是时间停止。", "洛岚救人要付出身体用力的代价，不临时增加飞行、传送或其他能力。", "贺峥先退出到安全平台，棚板才落在空桥面；不压中任何人。", "周围城市与车流继续运动；只受能力影响的小范围物体可悬浮。"], "dialogue": [], "test": "超能力规则、尺度与重量、救援空间、使用代价和动作结果。"}];

let selected=0;
const nav=document.getElementById("nav"),mode=document.getElementById("mode");
stories.forEach((s,i)=>{const button=document.createElement("button");button.type="button";button.textContent=s.id+" "+s.genre;button.addEventListener("click",()=>{selected=i;render()});nav.appendChild(button)});
function render(){
 const s=stories[selected];document.getElementById("title").textContent=s.genre+"｜《"+s.title+"》";
 document.getElementById("intro").textContent=s.environment+" 本题观察："+s.test;
 document.getElementById("story").textContent=s.story;document.getElementById("people").textContent=s.characters;
 [...nav.children].forEach((button,i)=>{button.classList.toggle("active",i===selected);button.setAttribute("aria-pressed",String(i===selected))});
 const grid=document.getElementById("grid");grid.replaceChildren();grid.classList.toggle("single",mode.value!=="all");
 variants.filter(v=>mode.value==="all"||v.key===mode.value).forEach(v=>{
  const file=fileMap[s.id][v.key],q=observations[file];
  const card=document.createElement("section");card.className="card";
  const title=document.createElement("h3");title.textContent=v.label;
  const link=document.createElement("a");link.href=file;link.target="_blank";link.rel="noopener";
  const img=document.createElement("img");img.src=file;img.alt=s.title+" — "+v.label+"首轮分镜图";img.loading="lazy";link.appendChild(img);
  const note=document.createElement("p");note.style.padding="0 14px 12px";
  note.textContent=q.needs_repair?"本轮需修："+q.issues.join("；"):"本轮未发现确定硬冲突，仍待用户审阅。";
  card.append(title,link,note);grid.appendChild(card);
 });
}
mode.addEventListener("change",render);render();
