<svg xmlns="http://www.w3.org/2000/svg" width="3080" height="2160" viewBox="0 0 1540 1080"><title>详图3_专项视觉与外部组合</title>
<rect x="0" y="0" width="1540" height="1080" rx="0" fill="#F8FAFC" stroke="#F8FAFC" stroke-width="2.5"/>
<rect x="35" y="180" width="1470" height="177" rx="16" fill="#FFFFFF" stroke="#BFCBDA" stroke-width="2.5"/>
<rect x="35" y="372" width="1470" height="177" rx="16" fill="#FFFFFF" stroke="#BFCBDA" stroke-width="2.5"/>
<rect x="35" y="564" width="1470" height="177" rx="16" fill="#FFFFFF" stroke="#BFCBDA" stroke-width="2.5"/>
<rect x="35" y="756" width="1470" height="177" rx="16" fill="#FFFFFF" stroke="#BFCBDA" stroke-width="2.5"/>
<text x="35" y="95.32000000000001" font-family="Microsoft YaHei,sans-serif" font-size="61" font-weight="700" fill="#10233B">详图3｜专项视觉与世界依据</text>
<text x="35" y="151.32" font-family="Microsoft YaHei,sans-serif" font-size="36" font-weight="400" fill="#42566F">战争、古风、硬科幻属于仓库；仙侠作为外部组合。</text>
<text x="60" y="241.28" font-family="Microsoft YaHei,sans-serif" font-size="44" font-weight="700" fill="#1D4ED8">战争与军事</text>
<text x="60" y="287.32" font-family="Microsoft YaHei,sans-serif" font-size="36" font-weight="400" fill="#42566F">war-design</text>
<text x="60" y="336.68" font-family="Microsoft YaHei,sans-serif" font-size="39" font-weight="400" fill="#10233B">装备、战斗关系、军事空间与电影画面。</text>
<text x="60" y="433.28" font-family="Microsoft YaHei,sans-serif" font-size="44" font-weight="700" fill="#1D4ED8">中国古风〔实验〕</text>
<text x="60" y="479.32" font-family="Microsoft YaHei,sans-serif" font-size="36" font-weight="400" fill="#42566F">guofeng-visual-director</text>
<text x="60" y="528.6800000000001" font-family="Microsoft YaHei,sans-serif" font-size="39" font-weight="400" fill="#10233B">文化、建筑、服饰、器物与视觉语言。</text>
<text x="60" y="625.28" font-family="Microsoft YaHei,sans-serif" font-size="44" font-weight="700" fill="#1D4ED8">硬科幻〔实验／未安装〕</text>
<text x="60" y="671.32" font-family="Microsoft YaHei,sans-serif" font-size="36" font-weight="400" fill="#42566F">hard-sci-fi-visual-director</text>
<text x="60" y="720.6800000000001" font-family="Microsoft YaHei,sans-serif" font-size="39" font-weight="400" fill="#10233B">工程、物理、尺度与形体依据；按问题加载专业资料。</text>
<text x="60" y="817.28" font-family="Microsoft YaHei,sans-serif" font-size="44" font-weight="700" fill="#1D4ED8">外部仙侠〔不计入21包〕</text>
<text x="60" y="863.32" font-family="Microsoft YaHei,sans-serif" font-size="36" font-weight="400" fill="#42566F">xianxia-visual-director</text>
<text x="60" y="912.6800000000001" font-family="Microsoft YaHei,sans-serif" font-size="39" font-weight="400" fill="#10233B">东方巨构、分层空间与真人摄影；不随本仓库分发。</text>
<text x="40" y="1032.56" font-family="Microsoft YaHei,sans-serif" font-size="38" font-weight="400" fill="#42566F">所有专项都保留已锁事实，不替代导演决定或用户验收。</text>
</svg>