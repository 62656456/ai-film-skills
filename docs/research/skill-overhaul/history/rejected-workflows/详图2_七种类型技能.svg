<text x="35" y="95.32000000000001" font-family="Microsoft YaHei,sans-serif" font-size="61" font-weight="700" fill="#10233B">详图2｜七种类型技能</text>
<text x="35" y="151.32" font-family="Microsoft YaHei,sans-serif" font-size="36" font-weight="400" fill="#42566F">按题材选择；提供设计方法，不规定固定镜数、秒数和配色。</text>
<text x="58" y="237.04000000000002" font-family="Microsoft YaHei,sans-serif" font-size="42" font-weight="700" fill="#1D4ED8">赛博朋克</text>
<text x="490" y="235.32" font-family="Microsoft YaHei,sans-serif" font-size="36" font-weight="400" fill="#42566F">cyberpunk-design</text>
<text x="58" y="294.8" font-family="Microsoft YaHei,sans-serif" font-size="40" font-weight="400" fill="#10233B">身体与技术、城市层次、实际光源。</text>
<text x="58" y="385.04" font-family="Microsoft YaHei,sans-serif" font-size="42" font-weight="700" fill="#1D4ED8">史诗</text>
<text x="490" y="383.32" font-family="Microsoft YaHei,sans-serif" font-size="36" font-weight="400" fill="#42566F">epic-design</text>
<text x="58" y="442.8" font-family="Microsoft YaHei,sans-serif" font-size="40" font-weight="400" fill="#10233B">尺度、秩序、群体与人物关系。</text>
<text x="58" y="533.04" font-family="Microsoft YaHei,sans-serif" font-size="42" font-weight="700" fill="#1D4ED8">奇幻</text>
<text x="490" y="531.32" font-family="Microsoft YaHei,sans-serif" font-size="36" font-weight="400" fill="#42566F">fantasy-design</text>
<text x="58" y="590.8" font-family="Microsoft YaHei,sans-serif" font-size="40" font-weight="400" fill="#10233B">世界规则、魔法作用与可信材质。</text>
<text x="58" y="681.04" font-family="Microsoft YaHei,sans-serif" font-size="42" font-weight="700" fill="#1D4ED8">恐怖</text>
<text x="490" y="679.32" font-family="Microsoft YaHei,sans-serif" font-size="36" font-weight="400" fill="#42566F">horror-design</text>
<text x="58" y="738.8" font-family="Microsoft YaHei,sans-serif" font-size="40" font-weight="400" fill="#10233B">威胁感知、异常出现与信息延迟。</text>
<text x="58" y="829.04" font-family="Microsoft YaHei,sans-serif" font-size="42" font-weight="700" fill="#1D4ED8">黑色／悬疑</text>
<text x="490" y="827.32" font-family="Microsoft YaHei,sans-serif" font-size="36" font-weight="400" fill="#42566F">noir-design</text>
<text x="58" y="886.8" font-family="Microsoft YaHei,sans-serif" font-size="40" font-weight="400" fill="#10233B">隐瞒、权力、视线与遮挡。</text>
<text x="58" y="977.04" font-family="Microsoft YaHei,sans-serif" font-size="42" font-weight="700" fill="#1D4ED8">爱情</text>
<text x="490" y="975.32" font-family="Microsoft YaHei,sans-serif" font-size="36" font-weight="400" fill="#42566F">romance-design</text>
<text x="58" y="1034.8" font-family="Microsoft YaHei,sans-serif" font-size="40" font-weight="400" fill="#10233B">距离、接触、回应与关系变化。</text>
<text x="58" y="1125.04" font-family="Microsoft YaHei,sans-serif" font-size="42" font-weight="700" fill="#1D4ED8">武侠</text>
<text x="490" y="1123.32" font-family="Microsoft YaHei,sans-serif" font-size="36" font-weight="400" fill="#42566F">wuxia-design</text>
<text x="58" y="1182.8" font-family="Microsoft YaHei,sans-serif" font-size="40" font-weight="400" fill="#10233B">身体、空间、攻防与江湖气质。</text>
