<text x="47" y="1279.8" font-family="Microsoft YaHei,sans-serif" font-size="40" font-weight="400" fill="#16733E">未通过就返修重测；正式后异常，可恢复备份。</text>
<text x="35" y="1370.32" font-family="Microsoft YaHei,sans-serif" font-size="36" font-weight="400" fill="#42566F">A/B仍为测试候选；当前默认5.6.5。完整技能职责见分区详图。</text>
