<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Open Film Skills capability map</title>
  <desc id="desc">Five capability blocks from directing and assets to visual language, production, and evidence.</desc>
  <rect width="1200" height="300" fill="#111821"/>
  <g font-family="Arial, Noto Sans, sans-serif">
    <text x="48" y="48" fill="#F4F0E8" font-size="20" font-weight="700">ONE ROUTE, DISTINCT AUTHORITIES</text><text x="1152" y="48" text-anchor="end" fill="#687687" font-size="12">OPEN FILM SKILLS / CAPABILITY MAP</text>
    <g transform="translate(48 82)"><rect width="200" height="158" rx="8" fill="#18222D" stroke="#FF6B35"/><text x="18" y="34" fill="#FF6B35" font-size="13" font-weight="700">01 · DIRECT</text><text x="18" y="67" fill="#F4F0E8" font-size="16">director-agent</text><text x="18" y="94" fill="#F4F0E8" font-size="16">storyboard-director</text><text x="18" y="128" fill="#738193" font-size="12">story → staging → shots</text></g>
    <g transform="translate(270 82)"><rect width="200" height="158" rx="8" fill="#18222D" stroke="#46C2CB"/><text x="18" y="34" fill="#46C2CB" font-size="13" font-weight="700">02 · DEFINE</text><text x="18" y="67" fill="#F4F0E8" font-size="16">character</text><text x="18" y="94" fill="#F4F0E8" font-size="16">scene · prop</text><text x="18" y="128" fill="#738193" font-size="12">identity → topology → state</text></g>
    <g transform="translate(492 82)"><rect width="200" height="158" rx="8" fill="#18222D" stroke="#D6A756"/><text x="18" y="34" fill="#D6A756" font-size="13" font-weight="700">03 · STYLE</text><text x="18" y="67" fill="#F4F0E8" font-size="16">8 genre lenses</text><text x="18" y="94" fill="#F4F0E8" font-size="16">observable parameters</text><text x="18" y="128" fill="#738193" font-size="12">light → material → motion</text></g>
    <g transform="translate(714 82)"><rect width="200" height="158" rx="8" fill="#18222D" stroke="#5B8CFF"/><text x="18" y="34" fill="#5B8CFF" font-size="13" font-weight="700">04 · PRODUCE</text><text x="18" y="67" fill="#F4F0E8" font-size="16">video production</text><text x="18" y="94" fill="#F4F0E8" font-size="16">short-drama flow</text><text x="18" y="128" fill="#738193" font-size="12">approval → generation → edit</text></g>
    <g transform="translate(936 82)"><rect width="216" height="158" rx="8" fill="#18222D" stroke="#7EE2A8"/><text x="18" y="34" fill="#7EE2A8" font-size="13" font-weight="700">05 · VERIFY</text><text x="18" y="67" fill="#F4F0E8" font-size="16">research · semantic layer</text><text x="18" y="94" fill="#F4F0E8" font-size="16">web quality · evidence</text><text x="18" y="128" fill="#738193" font-size="12">source → check → acceptance</text></g>
  </g>
</svg>
