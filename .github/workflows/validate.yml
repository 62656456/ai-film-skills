name: Validate Skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  platform-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install repository validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Run cross-platform regression tests
        run: python -m unittest discover -s tests -v

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install repository validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Run negative and regression tests
        run: python -m unittest discover -s tests -v
      - name: Regenerate GitHub-readable Skill guides
        run: |
          python scripts/generate_skill_guides.py
          git diff --exit-code -- docs/skills
      - name: Validate every registered bilingual Skill design guide
        run: python scripts/validate_skill_docs.py
      - name: Validate GitHub Pages landing page
        run: python scripts/validate_pages_site.py
      - name: Validate current original/preview showcase and historical gallery
        run: python scripts/validate_style_gallery.py
      - name: Validate portable repository
        run: python scripts/validate_repository.py
      - name: Validate every Skill in sibling-free isolation
        run: python scripts/validate_skill_independence.py
      - name: Build deterministic standalone packages
        run: python scripts/build_skill_packages.py --include-experimental --output dist/skills
      - name: Smoke-install the same Skill into native layouts
        run: |
          python scripts/install_skill.py director-agent --platform codex --target "$RUNNER_TEMP/codex/skills"
          python scripts/install_skill.py director-agent --platform claude-code --target "$RUNNER_TEMP/claude/skills"
          python scripts/install_skill.py director-agent --platform trae --target "$RUNNER_TEMP/trae/.agents/skills"
          python scripts/install_skill.py director-agent --platform codebuddy --target "$RUNNER_TEMP/codebuddy/skills"
          test -f "$RUNNER_TEMP/codex/skills/director-agent/SKILL.md"
          test -f "$RUNNER_TEMP/claude/skills/director-agent/SKILL.md"
          test -f "$RUNNER_TEMP/trae/.agents/skills/director-agent/SKILL.md"
          test -f "$RUNNER_TEMP/codebuddy/skills/director-agent/SKILL.md"
      - name: Check release manifest
        run: python -c "import json,pathlib; c=json.loads(pathlib.Path('docs/skill-contracts.json').read_text()); d=json.loads(pathlib.Path('dist/skills/manifest.json').read_text()); assert d['stable_skill_count']==sum(x['status']!='experimental' for x in c['skills']); assert d['experimental_skill_count']==sum(x['status']=='experimental' for x in c['skills']); assert d['package_standard']=='Agent Skills compatible SKILL.md folder'; assert d['source_tree_state']=='clean'; assert d['contract_sha256']"
