name: Validate storyboard preview

on:
  push:
    branches: [codex/ai-storyboard-director-5.6.0-preview]
  pull_request:
    paths:
      - previews/**
      - .github/workflows/storyboard-preview.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run preview runtime tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PREVIEW_TEST_TMP: ${{ runner.temp }}
        run: python -m unittest discover -s previews/tests -v
      - name: Validate isolated preview bundle
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python previews/validate_preview.py previews/ai-storyboard-director-preview
