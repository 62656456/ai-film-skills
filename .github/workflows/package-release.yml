name: Package standalone Skills

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository
        run: python scripts/validate_repository.py
      - name: Build standalone packages
        run: python scripts/build_skill_packages.py --include-experimental --output dist/skills
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: standalone-skills
          path: dist/skills/*
      - name: Attach packages to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/skills/* --clobber
