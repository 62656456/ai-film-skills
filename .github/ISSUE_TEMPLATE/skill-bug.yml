name: Skill behavior problem
description: Report a reproducible routing, instruction, output, or compatibility problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: skill
    attributes:
      label: Skill
      placeholder: ai-storyboard-director
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: Triggering request
      description: Remove private project details before posting.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Codex version, operating system, and relevant tool versions. Do not include tokens or local private paths.
